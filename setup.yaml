---
- name: Install and Start Nginx on Ubuntu and CentOS
  hosts: db01
  become: yes

  tasks:

    - name: Install Nginx on Ubuntu
      apt:
        name: nginx
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Install Nginx on CentOS
      yum:
        name: nginx
        state: present
      when: ansible_os_family == "RedHat"

    - name: Start and Enable Nginx
      service:
        name: nginx
        state: started
        enabled: yes

